<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>FLAG//HOURS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset & Root ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; }
    body { font-family: var(--font-mono); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

    /* ── Theme Variables ──────────────────────────────────── */
    :root {
      --font-mono: 'JetBrains Mono', 'Courier New', monospace;
      --font-display: 'Bebas Neue', sans-serif;
      /* Terminal (default) */
      --bg: #080808;
      --bg2: #101010;
      --bg3: #181818;
      --bg4: #202020;
      --border: #282828;
      --border2: #333;
      --accent: #f59e0b;
      --accent-dim: rgba(245,158,11,0.12);
      --accent-text: #000;
      --text: #e8e8e8;
      --text2: #888;
      --text3: #484848;
      --danger: #ef4444;
      --danger-dim: rgba(239,68,68,0.12);
      --success: #22c55e;
      --success-dim: rgba(34,197,94,0.12);
      --scan-color: rgba(245,158,11,0.03);
    }
    [data-theme="stealth"] {
      --bg: #0d1117; --bg2: #161b22; --bg3: #1c2128; --bg4: #21262d;
      --border: #2d333b; --border2: #373e47;
      --accent: #22d3ee; --accent-dim: rgba(34,211,238,0.1); --accent-text: #000;
      --text: #cdd9e5; --text2: #768390; --text3: #444c56;
      --scan-color: rgba(34,211,238,0.025);
    }
    [data-theme="carbon"] {
      --bg: #0a0a0a; --bg2: #141414; --bg3: #1c1c1c; --bg4: #242424;
      --border: #2e2e2e; --border2: #3a3a3a;
      --accent: #ff3333; --accent-dim: rgba(255,51,51,0.1); --accent-text: #fff;
      --text: #f0f0f0; --text2: #707070; --text3: #404040;
      --scan-color: rgba(255,51,51,0.025);
    }
    [data-theme="ghost"] {
      --bg: #f2f2ed; --bg2: #e8e8e3; --bg3: #deded9; --bg4: #d4d4cf;
      --border: #c4c4bf; --border2: #b4b4af;
      --accent: #111; --accent-dim: rgba(17,17,17,0.08); --accent-text: #fff;
      --text: #111; --text2: #666; --text3: #aaa;
      --scan-color: transparent;
    }
    [data-theme="nord"] {
      --bg: #2e3440; --bg2: #3b4252; --bg3: #434c5e; --bg4: #4c566a;
      --border: #434c5e; --border2: #4c566a;
      --accent: #88c0d0; --accent-dim: rgba(136,192,208,0.15); --accent-text: #2e3440;
      --text: #eceff4; --text2: #d8dee9; --text3: #7b88a1;
      --danger: #bf616a; --danger-dim: rgba(191,97,106,0.15);
      --success: #a3be8c; --success-dim: rgba(163,190,140,0.15);
      --scan-color: rgba(136,192,208,0.02);
    }
    [data-theme="amber"] {
      --bg: #0c0900; --bg2: #141100; --bg3: #1c1700; --bg4: #241e00;
      --border: #2e2800; --border2: #3d3500;
      --accent: #ffb300; --accent-dim: rgba(255,179,0,0.12); --accent-text: #000;
      --text: #ffe97a; --text2: #a87c00; --text3: #5a4200;
      --danger: #ff5252; --danger-dim: rgba(255,82,82,0.12);
      --success: #69f0ae; --success-dim: rgba(105,240,174,0.12);
      --scan-color: rgba(255,179,0,0.03);
    }
    [data-theme="synthwave"] {
      --bg: #0d0221; --bg2: #130a2e; --bg3: #1a113a; --bg4: #221848;
      --border: #2d1f5e; --border2: #3d2a7a;
      --accent: #f72585; --accent-dim: rgba(247,37,133,0.15); --accent-text: #fff;
      --text: #e0d7ff; --text2: #9d8ec7; --text3: #4d3d7a;
      --danger: #ff4d6d; --danger-dim: rgba(255,77,109,0.15);
      --success: #4cc9f0; --success-dim: rgba(76,201,240,0.15);
      --scan-color: rgba(247,37,133,0.025);
    }
    [data-theme="forest"] {
      --bg: #0b1a0e; --bg2: #112216; --bg3: #172c1c; --bg4: #1d3622;
      --border: #234228; --border2: #2e5433;
      --accent: #4ade80; --accent-dim: rgba(74,222,128,0.12); --accent-text: #0b1a0e;
      --text: #d4f0d8; --text2: #6dab7a; --text3: #2d5c36;
      --danger: #f87171; --danger-dim: rgba(248,113,113,0.12);
      --success: #86efac; --success-dim: rgba(134,239,172,0.12);
      --scan-color: rgba(74,222,128,0.025);
    }
    [data-theme="slate"] {
      --bg: #0f172a; --bg2: #1e293b; --bg3: #253347; --bg4: #2d3f55;
      --border: #334155; --border2: #475569;
      --accent: #7c3aed; --accent-dim: rgba(124,58,237,0.15); --accent-text: #fff;
      --text: #e2e8f0; --text2: #94a3b8; --text3: #475569;
      --danger: #f43f5e; --danger-dim: rgba(244,63,94,0.15);
      --success: #34d399; --success-dim: rgba(52,211,153,0.15);
      --scan-color: rgba(124,58,237,0.02);
    }

    /* ── Scanline effect ──────────────────────────────────── */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, var(--scan-color) 0px, var(--scan-color) 1px, transparent 1px, transparent 3px);
      pointer-events: none; z-index: 9999;
    }

    /* ── Scrollbar ────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); }

    /* ── Typography ───────────────────────────────────────── */
    .display { font-family: var(--font-display); letter-spacing: 0.05em; }
    .mono { font-family: var(--font-mono); }
    .label { font-size: 0.58rem; letter-spacing: 0.18em; color: var(--text3); text-transform: uppercase; }

    /* ── Buttons ──────────────────────────────────────────── */
    .btn {
      font-family: var(--font-mono); border: none; cursor: pointer;
      font-size: 0.7rem; letter-spacing: 0.12em; font-weight: 700;
      padding: 0.7rem 1.2rem; transition: opacity 0.15s, transform 0.1s;
      text-transform: uppercase; display: inline-flex; align-items: center; gap: 0.4rem;
    }
    .btn:active { transform: scale(0.97); }
    .btn-accent { background: var(--accent); color: var(--accent-text); }
    .btn-accent:hover { opacity: 0.88; }
    .btn-ghost { background: none; border: 1px solid var(--border); color: var(--text2); }
    .btn-ghost:hover { border-color: var(--border2); color: var(--text); }
    .btn-danger { background: none; border: 1px solid var(--border); color: var(--danger); }
    .btn-danger:hover { background: var(--danger-dim); }
    .btn:disabled { opacity: 0.3; cursor: default; }

    /* ── Inputs ───────────────────────────────────────────── */
    .inp {
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); padding: 0.65rem 0.85rem;
      font-family: var(--font-mono); font-size: 0.85rem;
      outline: none; width: 100%; transition: border-color 0.15s;
    }
    .inp:focus { border-color: var(--accent); }
    .inp::placeholder { color: var(--text3); }
    select.inp { appearance: none; -webkit-appearance: none; cursor: pointer; }
    select.inp option { background: var(--bg3); color: var(--text); }
    input[type="date"].inp::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; }

    /* ── Cards ────────────────────────────────────────────── */
    .card { background: var(--bg2); border: 1px solid var(--border); }
    .card-pad { padding: 1rem; }

    /* ── Layout ───────────────────────────────────────────── */
    .page { max-width: 640px; margin: 0 auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.85rem; }

    /* ── Animations ───────────────────────────────────────── */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideDown { from { opacity: 0; max-height: 0; } to { opacity: 1; max-height: 2000px; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .fade-in { animation: fadeIn 0.2s ease both; }
    .toast-anim { animation: fadeIn 0.2s ease both; }

    /* ── Sign-in Page ─────────────────────────────────────── */
    #signin-page {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem; gap: 2.5rem;
    }
    .signin-logo { text-align: center; }
    .signin-logo .wordmark { font-family: var(--font-display); font-size: 4rem; color: var(--accent); letter-spacing: 0.08em; line-height: 1; }
    .signin-logo .sub { font-size: 0.62rem; letter-spacing: 0.22em; color: var(--text3); margin-top: 0.3rem; }
    .signin-box {
      width: 100%; max-width: 380px;
      background: var(--bg2); border: 1px solid var(--border);
      padding: 2rem; display: flex; flex-direction: column; gap: 1.25rem;
    }
    .signin-note { font-size: 0.62rem; color: var(--text3); line-height: 1.7; border-top: 1px solid var(--border); padding-top: 1rem; }

    /* ── Top Bar ──────────────────────────────────────────── */
    #topbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg2); border-bottom: 1px solid var(--border);
      display: flex; align-items: stretch; justify-content: space-between;
    }
    .topbar-brand {
      font-family: var(--font-display); font-size: 1.3rem; color: var(--accent);
      letter-spacing: 0.1em; padding: 0 1rem; display: flex; align-items: center;
      border-right: 1px solid var(--border); flex-shrink: 0;
    }
    .topbar-nav { display: flex; flex: 1; }
    .nav-btn {
      background: none; border: none; border-bottom: 2px solid transparent;
      color: var(--text3); font-family: var(--font-mono); font-size: 0.6rem;
      font-weight: 700; letter-spacing: 0.14em; padding: 0.9rem 0.85rem;
      cursor: pointer; transition: all 0.15s; text-transform: uppercase; flex: 1;
    }
    .nav-btn:hover { color: var(--text2); }
    .nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .topbar-user {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0 0.75rem; border-left: 1px solid var(--border); flex-shrink: 0;
    }
    .avatar {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--accent-dim); border: 1px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 700; color: var(--accent); overflow: hidden; flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-name { font-size: 0.62rem; color: var(--text2); letter-spacing: 0.08em; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .signout-btn {
      background: none; border: 1px solid var(--border); color: var(--text3);
      font-family: var(--font-mono); font-size: 0.55rem; letter-spacing: 0.1em;
      padding: 0.25rem 0.45rem; cursor: pointer; transition: all 0.15s;
    }
    .signout-btn:hover { border-color: var(--danger); color: var(--danger); }

    /* ── Period Header ────────────────────────────────────── */
    .period-header {
      background: var(--bg2); border: 1px solid var(--border);
      padding: 0.85rem 1rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .period-dates { font-size: 0.9rem; font-weight: 700; color: var(--accent); margin-top: 0.2rem; }
    .total-hrs { font-size: 1.6rem; font-weight: 700; color: var(--text); font-family: var(--font-display); letter-spacing: 0.05em; }

    /* ── Entry Form ───────────────────────────────────────── */
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    .form-grid-3 { display: grid; grid-template-columns: 2fr 1.2fr 0.8fr; gap: 0.6rem; }
    .field { display: flex; flex-direction: column; gap: 0.25rem; }
    .err-msg { font-size: 0.65rem; color: var(--danger); padding: 0.35rem 0; animation: fadeIn 0.15s; }

    /* ── Entry Row ────────────────────────────────────────── */
    .entry-row {
      background: var(--bg2); border: 1px solid var(--border);
      padding: 0.7rem 0.85rem;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem;
      transition: border-color 0.15s; animation: fadeIn 0.18s ease both;
    }
    .entry-row:hover { border-color: var(--border2); }
    .entry-ro { color: var(--accent); font-weight: 700; font-size: 0.8rem; }
    .entry-date { color: var(--text3); font-size: 0.62rem; margin-left: 0.5rem; }
    .entry-vehicle { color: var(--text); font-size: 0.78rem; margin-top: 0.18rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
    .entry-service { color: var(--text2); font-size: 0.62rem; margin-top: 0.1rem; }
    .entry-hours { font-size: 1.1rem; font-weight: 700; color: var(--text); font-family: var(--font-display); letter-spacing: 0.05em; flex-shrink: 0; }
    .entry-actions { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
    .del-btn {
      background: none; border: 1px solid var(--border); color: var(--text3);
      font-size: 0.65rem; padding: 0.22rem 0.4rem; cursor: pointer;
      transition: all 0.15s; font-family: var(--font-mono);
    }
    .del-btn:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-dim); }

    /* ── RO Group Card ────────────────────────────────────── */
    .ro-group {
      background: var(--bg2); border: 1px solid var(--border);
      display: flex; flex-direction: column;
      animation: fadeIn 0.18s ease both; overflow: hidden;
    }
    .ro-group-header {
      padding: 0.7rem 0.85rem;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .ro-group-header-left { flex: 1; min-width: 0; }
    .ro-group-ro { color: var(--accent); font-weight: 700; font-size: 0.85rem; }
    .ro-group-vehicle { color: var(--text); font-size: 0.8rem; margin-top: 0.18rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ro-group-subtotal { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; color: var(--accent); letter-spacing: 0.05em; flex-shrink: 0; }
    .ro-group-subtotal-label { font-size: 0.55rem; letter-spacing: 0.15em; color: var(--text3); text-align: right; }
    .ro-service-line {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 0.85rem; border-bottom: 1px solid var(--border);
      background: var(--bg3);
    }
    .ro-service-line:last-of-type { border-bottom: none; }
    .ro-service-info { flex: 1; min-width: 0; }
    .ro-svc-name { font-size: 0.72rem; color: var(--text2); }
    .ro-svc-date { font-size: 0.6rem; color: var(--text3); margin-left: 0.4rem; }
    .ro-svc-hrs { font-family: var(--font-display); font-size: 1rem; font-weight: 700; color: var(--text); letter-spacing: 0.04em; flex-shrink: 0; }
    .edit-btn {
      background: none; border: 1px solid var(--border); color: var(--text3);
      font-size: 0.6rem; padding: 0.2rem 0.38rem; cursor: pointer;
      transition: all 0.15s; font-family: var(--font-mono); flex-shrink: 0;
    }
    .edit-btn:hover { border-color: var(--accent); color: var(--accent); }
    /* Inline edit panel */
    .ro-edit-panel {
      background: var(--bg4); border-top: 1px solid var(--border);
      padding: 0.75rem 0.85rem; display: flex; flex-direction: column; gap: 0.5rem;
      animation: fadeIn 0.15s ease both;
    }
    .ro-edit-panel .form-grid-2 { gap: 0.45rem; }
    .ro-edit-panel .form-grid-3 { gap: 0.45rem; }
    .ro-edit-actions { display: flex; gap: 0.4rem; margin-top: 0.15rem; }
    /* Add service panel */
    .ro-add-svc-panel {
      background: var(--bg4); border-top: 1px solid var(--border);
      padding: 0.75rem 0.85rem; display: flex; flex-direction: column; gap: 0.5rem;
      animation: fadeIn 0.15s ease both;
    }
    .ro-group-footer {
      padding: 0.45rem 0.85rem;
      display: flex; gap: 0.4rem; border-top: 1px solid var(--border);
      background: var(--bg2);
    }
    .add-svc-btn {
      background: none; border: 1px solid var(--border); color: var(--text2);
      font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.1em;
      padding: 0.35rem 0.6rem; cursor: pointer; transition: all 0.15s; text-transform: uppercase;
    }
    .add-svc-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Totals Bar ───────────────────────────────────────── */
    .totals-bar {
      background: var(--accent-dim); border: 1px solid var(--accent);
      padding: 0.65rem 0.85rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .totals-label { font-size: 0.6rem; letter-spacing: 0.15em; color: var(--accent); }
    .totals-val { font-size: 1rem; font-weight: 700; color: var(--accent); font-family: var(--font-display); letter-spacing: 0.05em; }

    /* ── History ──────────────────────────────────────────── */
    .hist-period {
      background: var(--bg2); border: 1px solid var(--border);
      overflow: hidden; transition: border-color 0.15s;
    }
    .hist-period:hover { border-color: var(--border2); }
    .hist-header {
      padding: 0.85rem 1rem; display: flex; justify-content: space-between;
      align-items: center; cursor: pointer; user-select: none;
    }
    .hist-period-label { font-size: 0.82rem; font-weight: 700; color: var(--text); }
    .hist-meta { font-size: 0.62rem; color: var(--text3); margin-top: 0.15rem; }
    .hist-total { font-size: 1.1rem; font-weight: 700; color: var(--accent); font-family: var(--font-display); letter-spacing: 0.05em; }
    .hist-chevron { color: var(--text3); font-size: 0.65rem; transition: transform 0.2s; }
    .hist-chevron.open { transform: rotate(180deg); }
    .hist-body { border-top: 1px solid var(--border); padding: 0.75rem; display: flex; flex-direction: column; gap: 0.35rem; }
    .hist-entry {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 0.5rem 0.65rem; background: var(--bg3); border: 1px solid var(--border);
    }

    /* ── Verify Page ──────────────────────────────────────── */
    .verify-period-select { display: flex; flex-direction: column; gap: 0.5rem; }
    .verify-ro-row {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      background: var(--bg2);
      transition: background 0.15s, border-color 0.15s;
    }
    .verify-ro-row.confirmed {
      background: var(--success-dim);
      border-color: var(--success);
    }
    .verify-ro-row.missing {
      background: var(--danger-dim);
      border-color: var(--danger);
    }
    .verify-check {
      width: 22px; height: 22px; flex-shrink: 0;
      border: 2px solid var(--border2); background: var(--bg3);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; transition: all 0.15s; color: var(--success);
    }
    .verify-check.checked { border-color: var(--success); background: var(--success-dim); }
    .verify-check.missing-check { border-color: var(--danger); }
    .verify-check.marked-missing { border-color: var(--danger); background: var(--danger-dim); color: var(--danger); }
    .verify-ro-info { flex: 1; min-width: 0; }
    .verify-ro-num { font-size: 0.8rem; font-weight: 700; color: var(--accent); }
    .verify-ro-num.missing-text { color: var(--danger); }
    .verify-vehicle { font-size: 0.75rem; color: var(--text); margin-top: 0.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .verify-service { font-size: 0.62rem; color: var(--text2); margin-top: 0.08rem; }
    .verify-hrs { font-size: 1rem; font-weight: 700; font-family: var(--font-display); letter-spacing: 0.05em; flex-shrink: 0; }
    .verify-hrs.confirmed { color: var(--success); }
    .verify-hrs.missing { color: var(--danger); }
    .verify-status-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.65rem 0.85rem;
      background: var(--bg2); border: 1px solid var(--border);
    }
    .verify-progress {
      height: 3px; background: var(--bg4); margin-top: 0.5rem; overflow: hidden;
    }
    .verify-progress-fill {
      height: 100%; background: var(--success); transition: width 0.3s ease;
    }
    .missing-input-row {
      display: flex; gap: 0.5rem; align-items: center;
      padding: 0.5rem 0.85rem;
      border: 1px dashed var(--danger); background: var(--danger-dim);
      margin-top: 0.25rem;
    }
    .missing-ro-inp { flex: 1; }
    .verify-section-label {
      font-size: 0.58rem; letter-spacing: 0.18em; color: var(--text3);
      text-transform: uppercase; padding: 0.5rem 0 0.25rem;
    }

    /* ── Completed RO styles ──────────────────────────────── */
    .ro-complete-btn {
      background: none; border: 2px solid var(--border2); color: var(--text3);
      width: 22px; height: 22px; flex-shrink: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; transition: all 0.15s; border-radius: 2px;
    }
    .ro-complete-btn:hover { border-color: var(--success); color: var(--success); }
    .ro-complete-btn.completed { border-color: var(--success); background: var(--success-dim); color: var(--success); }
    .ro-group.is-completed { opacity: 0.55; }
    .ro-group.is-completed .ro-group-ro { text-decoration: line-through; color: var(--text3); }
    .completed-section-toggle {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.5rem 0.85rem; background: var(--bg2); border: 1px solid var(--border);
      cursor: pointer; transition: border-color 0.15s;
    }
    .completed-section-toggle:hover { border-color: var(--border2); }
    /* Move-to-period panel */
    .ro-move-panel {
      background: var(--bg4); border-top: 1px solid var(--border);
      padding: 0.75rem 0.85rem; display: flex; flex-direction: column; gap: 0.5rem;
      animation: fadeIn 0.15s ease both;
    }

    /* ── Settings ─────────────────────────────────────────── */
    .settings-section { background: var(--bg2); border: 1px solid var(--border); padding: 1.1rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .settings-section-title { font-size: 0.6rem; letter-spacing: 0.18em; color: var(--text3); padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
    .service-item { display: flex; gap: 0.4rem; align-items: center; animation: fadeIn 0.15s; }
    .reorder-btn {
      background: none; border: 1px solid var(--border); color: var(--text3);
      font-family: var(--font-mono); font-size: 0.7rem; padding: 0.4rem 0.45rem;
      cursor: pointer; flex-shrink: 0; transition: all 0.15s;
    }
    .reorder-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .reorder-btn:disabled { opacity: 0.2; cursor: default; }
    .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .theme-btn {
      padding: 0.7rem 0.5rem; border: 1px solid var(--border); background: var(--bg3);
      color: var(--text2); font-family: var(--font-mono); font-size: 0.65rem;
      letter-spacing: 0.1em; cursor: pointer; transition: all 0.15s; text-transform: uppercase; text-align: center;
    }
    .theme-btn:hover { border-color: var(--border2); color: var(--text); }
    .theme-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); font-weight: 700; }

    /* ── Toast ────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      background: var(--success); color: #000;
      font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.12em; padding: 0.6rem 1.25rem;
      z-index: 9000; display: none; white-space: nowrap;
      animation: toast-anim 0.2s ease;
    }

    /* ── Empty State ──────────────────────────────────────── */
    .empty { text-align: center; padding: 3rem 1rem; color: var(--text3); font-size: 0.75rem; letter-spacing: 0.08em; }

    /* ── Google Drive Backup ──────────────────────────────── */
    .gdrive-status {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.65rem; letter-spacing: 0.1em; color: var(--text3);
      padding: 0.4rem 0; font-family: var(--font-mono);
    }
    .gdrive-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
      background: var(--text3);
    }
    .gdrive-dot.connected { background: var(--success); }
    .gdrive-dot.error { background: var(--danger); }
    #modal-overlay {
      position: fixed; inset: 0; z-index: 10000;
      background: rgba(0,0,0,0.72);
      display: none; align-items: center; justify-content: center;
      padding: 1.5rem;
      backdrop-filter: blur(2px);
    }
    #modal-overlay.open { display: flex; }
    #modal-box {
      background: var(--bg2); border: 1px solid var(--border2);
      width: 100%; max-width: 320px;
      padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;
      animation: fadeIn 0.18s ease both;
    }
    #modal-title {
      font-family: var(--font-mono); font-size: 0.65rem;
      letter-spacing: 0.18em; color: var(--text3); text-transform: uppercase;
    }
    #modal-msg {
      font-family: var(--font-mono); font-size: 0.82rem;
      color: var(--text); line-height: 1.6;
    }
    #modal-actions { display: flex; gap: 0.5rem; }
    #modal-actions button { flex: 1; justify-content: center; }

    /* ── Export btn ───────────────────────────────────────── */
    .export-row { display: flex; justify-content: flex-end; }

    /* ── Responsive ───────────────────────────────────────── */
    @media (max-width: 480px) {
      .form-grid-3 { grid-template-columns: 1fr 1fr; }
      .form-grid-3 .field:last-child { grid-column: span 2; }
      .user-name { display: none; }
      .topbar-brand { font-size: 1.1rem; padding: 0 0.75rem; }
      .entry-vehicle { max-width: 140px; }
    }
  </style>
</head>
<body data-theme="terminal">

<div id="toast"></div>

    <div class="field">

      ACCESS TERMINAL →
    </button>

  <div id="page-verify" class="page" style="display:none"></div>
  <div id="page-settings" class="page" style="display:none"></div>

</div>

<script>
// ═══════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════
const DEFAULT_SERVICES = [
  'Prep','Polish','PPF','Windshield PPF',
  'Ceramic Coating','Vinyl','Vinyl Removal',
  'PPF Removal','Lux Tint','Parts Removal'
];
const DEFAULT_ANCHOR = '2026-05-18';
const THEMES = ['terminal','stealth','carbon','ghost','nord','amber','synthwave','forest','slate'];
const THEME_LABELS = {
  terminal:'Terminal', stealth:'Stealth', carbon:'Carbon', ghost:'Ghost',
  nord:'Nord', amber:'Amber', synthwave:'Synthwave', forest:'Forest', slate:'Slate'
};

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let currentUser = null;
let entries = [];
let services = [...DEFAULT_SERVICES];
let currentTheme = 'terminal';
let anchorDate = DEFAULT_ANCHOR;
let currentPage = 'log';
let expandedPeriods = new Set();
let expandedEdits = new Set();
let expandedAddSvc = new Set();
let expandedMovePeriod = new Set(); // roKeys with open move-period panel
let completedROs = {};      // { [roKey]: true } — roKey = ro.trim().toLowerCase()
let showCompleted = false;  // toggle for completed section on log page
let verifyChecks = {};
let verifyMissing = [];
let verifySelectedPeriod = null;

// ═══════════════════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════════════════
function nsKey(key) { return `flaghours_${currentUser.id}_${key}`; }
function load(key, fallback) {
  try { const v = localStorage.getItem(nsKey(key)); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function save(key, value) { localStorage.setItem(nsKey(key), JSON.stringify(value)); }

// ═══════════════════════════════════════════════════════════
// AUTO-LOGIN — restore last session on page load
// ═══════════════════════════════════════════════════════════
(function restoreSession() {
  try {
    const saved = localStorage.getItem('flaghours_last_user');
    if (saved) {
      const user = JSON.parse(saved);
      if (user && user.id && user.name) {
        // Fire after DOM is ready (script runs inline so just defer)
        setTimeout(() => signIn(user), 0);
      }
    }
  } catch (e) { /* no saved session */ }
})();

// ═══════════════════════════════════════════════════════════
// PAY PERIOD LOGIC
// ═══════════════════════════════════════════════════════════
function getPeriodForDate(dateStr, anchor) {
  const d = new Date(dateStr + 'T00:00:00');
  const a = new Date(anchor + 'T00:00:00');
  const diff = Math.floor((d - a) / 86400000);
  const idx = Math.floor(diff / 14);
  const start = new Date(a); start.setDate(a.getDate() + idx * 14);
  const end = new Date(start); end.setDate(start.getDate() + 13);
  return { start: isoDate(start), end: isoDate(end) };
}
function getCurrentPeriod() { return getPeriodForDate(isoDate(new Date()), anchorDate); }
function isoDate(d) { return d.toISOString().split('T')[0]; }
function fmtDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}
function periodLabel(start, end) { return `${fmtDate(start)} – ${fmtDate(end)}`; }
function periodKey(start, end) { return `${start}_${end}`; }

// ═══════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════
function localLogin() {
  const name = document.getElementById('demo-name-input').value.trim();
  if (!name) { showToast('Enter your name first', true); return; }
  const id = 'local_' + name.toLowerCase().replace(/\s+/g, '_');
  signIn({ id, name, avatar: null });
}

document.getElementById('demo-name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') localLogin();
});

function signIn(user) {
  currentUser = user;
  
  // Persist session so page reopens signed in
  localStorage.setItem('flaghours_last_user', JSON.stringify(user));

  // Load user data
  entries = load('entries', []);
  services = load('services', [...DEFAULT_SERVICES]);
  currentTheme = load('theme', 'terminal');
  anchorDate = load('anchor', DEFAULT_ANCHOR);
  verifyChecks = load('verifyChecks', {});
  verifyMissing = load('verifyMissing', []);
  verifySelectedPeriod = load('verifySelectedPeriod', null);
  completedROs = load('completedROs', {});

  applyTheme(currentTheme);

  // Update UI
  const av = document.getElementById('user-avatar');
  av.textContent = user.name.charAt(0).toUpperCase();
  
  document.getElementById('user-name-display').textContent = user.name.split(' ')[0].toUpperCase();

  document.getElementById('signin-page').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  renderLog();
  // Pre-load Google Identity Services in background so Drive backup is ready
  if (GDRIVE_CLIENT_ID) initGoogleDrive();
}

function signOut() {
  localStorage.removeItem('flaghours_last_user');
  currentUser = null; entries = []; services = [...DEFAULT_SERVICES];
  currentTheme = 'terminal'; anchorDate = DEFAULT_ANCHOR;
  verifyChecks = {}; verifyMissing = []; verifySelectedPeriod = null; completedROs = {};
  document.getElementById('app').style.display = 'none';
  document.getElementById('signin-page').style.display = 'flex';
  document.getElementById('demo-name-input').value = '';
}

// ═══════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════
function switchPage(page) {
  currentPage = page;
  ['log','history','verify','settings'].forEach(p => {
    document.getElementById(`page-${p}`).style.display = p === page ? 'flex' : 'none';
    document.querySelector(`[data-page="${p}"]`).classList.toggle('active', p === page);
  });
  if (page === 'log') renderLog();
  if (page === 'history') renderHistory();
  if (page === 'verify') renderVerify();
  if (page === 'settings') renderSettings();
}

// ═══════════════════════════════════════════════════════════
// THEME
// ═══════════════════════════════════════════════════════════
function applyTheme(theme) {
  document.body.setAttribute('data-theme', theme);
  currentTheme = theme;
}

// ═══════════════════════════════════════════════════════════
// MODAL (replaces native browser confirm() for mobile)
// ═══════════════════════════════════════════════════════════
let _modalResolve = null;

function showModal(msg, title = 'CONFIRM ACTION') {
  return new Promise(resolve => {
    _modalResolve = resolve;
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-msg').textContent = msg;
    document.getElementById('modal-overlay').classList.add('open');
  });
}

document.getElementById('modal-confirm').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('open');
  if (_modalResolve) { _modalResolve(true); _modalResolve = null; }
});
document.getElementById('modal-cancel').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('open');
  if (_modalResolve) { _modalResolve(false); _modalResolve = null; }
});
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('open');
    if (_modalResolve) { _modalResolve(false); _modalResolve = null; }
  }
});

// ═══════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════
let toastTimer;
function showToast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isErr ? 'var(--danger)' : 'var(--success)';
  t.style.color = isErr ? '#fff' : '#000';
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2200);
}

// ═══════════════════════════════════════════════════════════
// DATA IMPORT/EXPORT
// ═══════════════════════════════════════════════════════════
function exportCSV(rows, filename) {
  const header = 'RO#,Vehicle Info,Date,Service,Hours Paid,Pay Period Start,Pay Period End\n';
  const body = rows.map(e =>
    [e.ro, e.vehicle, e.date, e.service, e.hours, e.periodStart, e.periodEnd]
      .map(v => `"${String(v).replace(/"/g,'""')}"`)
      .join(',')
  ).join('\n');
  const blob = new Blob([header + body], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
  showToast('CSV exported');
}

function exportBackup() {
  const data = {
    version: 1,
    user: currentUser,
    entries: entries,
    services: services,
    theme: currentTheme,
    anchorDate: anchorDate,
    completedROs: completedROs,
    verifyChecks: verifyChecks
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `flag-hours-backup-${currentUser.name}-${isoDate(new Date())}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Full backup exported');
}

// ═══════════════════════════════════════════════════════════
// GOOGLE DRIVE BACKUP (write-only, no sync)
// ═══════════════════════════════════════════════════════════
// Uses Google Identity Services (GIS) for OAuth token
// Uploads a JSON file to the user's Google Drive root folder.
// No data is ever read back from Drive.

const GDRIVE_CLIENT_ID   = '64096206329-0795k2ldkintcenss1fndrehonkln49o.apps.googleusercontent.com'; // ← paste your OAuth Client ID here
const GDRIVE_SCOPE       = 'https://www.googleapis.com/auth/drive.file';

let gdriveToken = null;          // access token for this session
let gdriveTokenClient = null;    // GIS TokenClient instance

function initGoogleDrive() {
  // Load GIS script if not already loaded
  if (window.google && window.google.accounts) {
    _buildTokenClient();
    return;
  }
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.onload = _buildTokenClient;
  s.onerror = () => { showToast('Could not load Google auth', true); updateDriveStatus('error'); };
  document.head.appendChild(s);
}

function _buildTokenClient() {
  if (!GDRIVE_CLIENT_ID) {
    showToast('Add your Google OAuth Client ID to enable Drive backup', true);
    updateDriveStatus('error', 'OAuth Client ID not configured');
    return;
  }
  gdriveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GDRIVE_CLIENT_ID,
    scope: GDRIVE_SCOPE,
    callback: (tokenResponse) => {
      if (tokenResponse.error) {
        showToast('Google auth failed: ' + tokenResponse.error, true);
        updateDriveStatus('error');
        return;
      }
      gdriveToken = tokenResponse.access_token;
      updateDriveStatus('connected');
      showToast('Google Drive connected');
      renderSettings(); // refresh button state
    }
  });
}

function requestDriveAccess() {
  if (!gdriveTokenClient) { initGoogleDrive(); setTimeout(requestDriveAccess, 800); return; }
  gdriveTokenClient.requestAccessToken({ prompt: 'consent' });
}

async function backupToDrive() {
  if (!gdriveToken) {
    // Kick off auth, then backup will be triggered from callback
    if (!gdriveTokenClient) initGoogleDrive();
    // Request token with no prompt if we think we're already authed, else show picker
    if (gdriveTokenClient) {
      gdriveTokenClient.callback = (tokenResponse) => {
        if (tokenResponse.error) { showToast('Google auth failed', true); return; }
        gdriveToken = tokenResponse.access_token;
        updateDriveStatus('connected');
        renderSettings();
        _uploadToDrive(); // auto-proceed after auth
      };
      gdriveTokenClient.requestAccessToken({});
    }
    return;
  }
  await _uploadToDrive();
}

async function _uploadToDrive() {
  const data = {
    version: 1,
    user: currentUser,
    entries: entries,
    services: services,
    theme: currentTheme,
    anchorDate: anchorDate,
    completedROs: completedROs,
    verifyChecks: verifyChecks,
    backedUpAt: new Date().toISOString()
  };

  const filename = `flag-hours-backup-${currentUser.name}-${isoDate(new Date())}.json`;
  const content = JSON.stringify(data, null, 2);

  // Use Drive multipart upload (simple, no resumable needed for small files)
  const boundary = 'flaghours_backup_boundary';
  const delimiter = `\r\n--${boundary}\r\n`;
  const closeDelimiter = `\r\n--${boundary}--`;

  const metadata = JSON.stringify({ name: filename, mimeType: 'application/json' });

  const body =
    delimiter +
    'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
    metadata +
    delimiter +
    'Content-Type: application/json\r\n\r\n' +
    content +
    closeDelimiter;

  const btn = document.getElementById('gdrive-backup-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'UPLOADING...'; }

  try {
    const res = await fetch(
      'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',
      {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${gdriveToken}`,
          'Content-Type': `multipart/related; boundary="${boundary}"`,
        },
        body: body
      }
    );

    if (res.status === 401) {
      // Token expired — clear and re-auth
      gdriveToken = null;
      updateDriveStatus('disconnected');
      showToast('Session expired — reconnect to Drive', true);
      renderSettings();
      return;
    }

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err?.error?.message || `HTTP ${res.status}`);
    }

    const result = await res.json();
    showToast(`Backed up to Drive: ${filename}`);
    updateDriveStatus('connected', `Last backup: ${new Date().toLocaleTimeString()}`);
    renderSettings();
  } catch (err) {
    console.error('Drive backup error:', err);
    showToast('Drive backup failed: ' + err.message, true);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '☁ BACKUP TO DRIVE'; }
  }
}

function updateDriveStatus(state, msg) {
  const dot = document.getElementById('gdrive-dot');
  const text = document.getElementById('gdrive-status-text');
  if (!dot || !text) return;
  dot.className = 'gdrive-dot' + (state === 'connected' ? ' connected' : state === 'error' ? ' error' : '');
  text.textContent = msg || (state === 'connected' ? 'Connected to Google Drive' : state === 'error' ? 'Connection error' : 'Not connected');
}

function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      const data = JSON.parse(e.target.result);
      
      // Basic validation checks
      if (!data.entries || !Array.isArray(data.entries) || !data.services) {
        throw new Error("Invalid backup format");
      }

      const ok = await showModal('This will permanently overwrite your current data with the backup file. Continue?', 'IMPORT BACKUP');
      if (!ok) {
        event.target.value = '';
        return;
      }

      // Restore data state
      entries = data.entries;
      services = data.services;
      if (data.theme) currentTheme = data.theme;
      if (data.anchorDate) anchorDate = data.anchorDate;

      // Save to local storage
      save('entries', entries);
      save('services', services);
      save('theme', currentTheme);
      save('anchor', anchorDate);

      // Re-apply settings visually
      applyTheme(currentTheme);
      showToast('Backup imported successfully');
      renderSettings();
    } catch (err) {
      showToast('Error importing file format', true);
      console.error(err);
    }
    event.target.value = ''; // Reset input to allow selecting same file again
  };
  reader.readAsText(file);
}

// ═══════════════════════════════════════════════════════════
// LOG PAGE
// ═══════════════════════════════════════════════════════════
function groupByRO(entryList) {
  // Group entries by ro+vehicle key, preserving insertion order of first occurrence
  const order = [];
  const map = {};
  entryList.forEach(e => {
    const k = e.ro.trim().toLowerCase();
    if (!map[k]) { map[k] = { ro: e.ro, vehicle: e.vehicle, lines: [] }; order.push(k); }
    map[k].lines.push(e);
  });
  return order.map(k => map[k]);
}

function renderLog() {
  const period = getCurrentPeriod();

  // Collect entries for current period PLUS any incomplete ROs from past periods
  const allActiveEntries = entries.filter(e => {
    const roKey = e.ro.trim().toLowerCase();
    // Always include current period entries
    if (e.periodStart === period.start && e.periodEnd === period.end) return true;
    // Include past-period entries whose RO is not completed — they carry forward
    if (e.periodStart < period.start && !completedROs[roKey]) return true;
    return false;
  });

  const incompleteEntries = allActiveEntries.filter(e => !completedROs[e.ro.trim().toLowerCase()]);
  const completedEntries = allActiveEntries.filter(e => !!completedROs[e.ro.trim().toLowerCase()]);
  const total = allActiveEntries.reduce((s, e) => s + e.hours, 0);
  const incompleteTotal = incompleteEntries.reduce((s, e) => s + e.hours, 0);
  const completedTotal = completedEntries.reduce((s, e) => s + e.hours, 0);
  const today = isoDate(new Date());
  const sel = services.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');

  const incompleteHTML = incompleteEntries.length === 0
    ? `<div class="empty fade-in">NO ACTIVE ROs</div>`
    : renderGroupedEntries(incompleteEntries, sel);

  const completedGroupsHTML = completedEntries.length === 0
    ? `<div class="empty" style="padding:1rem 0.85rem">NO COMPLETED ROs</div>`
    : renderGroupedEntries(completedEntries, sel);

  document.getElementById('page-log').innerHTML = `
    <div class="period-header fade-in">
      <div>
        <div class="label">CURRENT PAY PERIOD</div>
        <div class="period-dates">${periodLabel(period.start, period.end)}</div>
      </div>
      <div style="text-align:right">
        <div class="label">ACTIVE HRS</div>
        <div class="total-hrs">${incompleteTotal.toFixed(2)}</div>
      </div>
    </div>

    <div class="card card-pad fade-in" style="display:flex;flex-direction:column;gap:0.6rem">
      <div class="label" style="padding-bottom:0.25rem">NEW ENTRY</div>
      <div class="form-grid-2">
        <div class="field">
          <label class="label">RO#</label>
          <input id="f-ro" class="inp" type="text" placeholder="12345" autocomplete="off" />
        </div>
        <div class="field">
          <label class="label">DATE</label>
          <input id="f-date" class="inp" type="date" value="${today}" />
        </div>
      </div>
      <div class="field">
        <label class="label">VEHICLE INFO</label>
        <input id="f-vehicle" class="inp" type="text" placeholder="2024 Honda Accord" autocomplete="off" />
      </div>
      <div class="form-grid-3">
        <div class="field">
          <label class="label">SERVICE</label>
          <select id="f-service" class="inp">${sel}</select>
        </div>
        <div class="field">
          <label class="label">HOURS PAID</label>
          <input id="f-hours" class="inp" type="text" inputmode="decimal" placeholder="2.5" autocomplete="off" />
        </div>
        <div class="field" style="justify-content:flex-end">
          <label class="label">&nbsp;</label>
          <button class="btn btn-accent" onclick="addEntry()" style="width:100%;justify-content:center;padding:0.65rem 0.5rem">+ LOG</button>
        </div>
      </div>
      <div id="form-err" class="err-msg" style="display:none"></div>
    </div>

    ${allActiveEntries.length > 0 ? `
    <div class="export-row fade-in">
      <button class="btn btn-ghost" onclick="exportCSV(getCurrentPeriodEntries(), 'flag-hours-${period.start}.csv')">
        ↓ EXPORT PERIOD CSV
      </button>
    </div>` : ''}

    <div id="entries-list">
      <div class="verify-section-label" style="padding:0 0 0.25rem">ACTIVE ROs — tap ✓ to mark complete</div>
      ${incompleteHTML}

      <div class="completed-section-toggle fade-in" onclick="toggleShowCompleted()">
        <span class="label" style="color:var(--success)">✓ COMPLETED ROs (${completedEntries.length > 0 ? groupByRO(completedEntries).length : 0})</span>
        <span style="font-size:0.65rem;color:var(--text3)">${showCompleted ? '▲ HIDE' : '▼ SHOW'}</span>
      </div>
      ${showCompleted ? `<div style="display:flex;flex-direction:column;gap:0.85rem">${completedGroupsHTML}</div>` : ''}

      ${allActiveEntries.length > 0 ? `
      <div class="totals-bar fade-in">
        <span class="totals-label">PERIOD TOTAL</span>
        <span class="totals-val">${total.toFixed(2)} HRS</span>
      </div>` : ''}
    </div>
  `;

  document.getElementById('f-ro').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('f-vehicle').focus(); });
  document.getElementById('f-vehicle').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('f-hours').focus(); });
  document.getElementById('f-hours').addEventListener('keydown', e => { if (e.key === 'Enter') addEntry(); });
}

function renderGroupedEntries(entryList, selHtml) {
  const groups = groupByRO(entryList);
  if (!selHtml) selHtml = services.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
  return groups.map(g => roGroupHTML(g, selHtml)).join('');
}

function roGroupHTML(g, selHtml) {
  const roKey = g.ro.trim().toLowerCase();
  const subtotal = g.lines.reduce((s, e) => s + e.hours, 0);
  const isAddOpen = expandedAddSvc.has(roKey);
  const isMoveOpen = expandedMovePeriod.has(roKey);
  const isCompleted = !!completedROs[roKey];

  const serviceLines = g.lines.map(e => {
    const isEditOpen = expandedEdits.has(e.id);
    return `
      <div class="ro-service-line" id="sline-${e.id}">
        <div class="ro-service-info">
          <span class="ro-svc-name">${esc(e.service)}</span>
          <span class="ro-svc-date">${e.date}</span>
        </div>
        <span class="ro-svc-hrs">${Number(e.hours).toFixed(2)}</span>
        <button class="edit-btn" onclick="toggleEditPanel('${e.id}')" title="Edit">✎</button>
        <button class="del-btn" onclick="deleteEntry('${e.id}')">✕</button>
      </div>
      ${isEditOpen ? editPanelHTML(e, selHtml) : ''}
    `;
  }).join('');

  // Build period options for move panel (all periods except the one these entries belong to)
  const allPeriodKeys = getAllPastAndCurrentPeriods();
  const currentEntryPeriod = g.lines[0] ? periodKey(g.lines[0].periodStart, g.lines[0].periodEnd) : null;
  const movePeriodOptions = allPeriodKeys
    .filter(p => p.key !== currentEntryPeriod)
    .map(p => `<option value="${p.key}">${periodLabel(p.start, p.end)}</option>`)
    .join('');

  const movePanelHTML = isMoveOpen ? `
    <div class="ro-move-panel" id="movepanel-${roKey}">
      <div class="label" style="color:var(--accent)">MOVE #${esc(g.ro)} TO PERIOD</div>
      <div class="field">
        <label class="label">TARGET PAY PERIOD</label>
        <select class="inp" id="move-period-${roKey}">
          ${movePeriodOptions || '<option disabled>No other periods available</option>'}
        </select>
      </div>
      <div style="display:flex;gap:0.4rem">
        <button class="btn btn-accent" onclick="moveROToPeriod('${roKey}')" style="flex:1;justify-content:center">MOVE</button>
        <button class="btn btn-ghost" onclick="toggleMovePeriod('${roKey}')" style="flex:1;justify-content:center">CANCEL</button>
      </div>
    </div>` : '';

  return `<div class="ro-group ${isCompleted ? 'is-completed' : ''}" id="rogroup-${roKey}">
    <div class="ro-group-header">
      <button class="ro-complete-btn ${isCompleted ? 'completed' : ''}" onclick="toggleCompleteRO('${roKey}')" title="${isCompleted ? 'Mark incomplete' : 'Mark complete'}">
        ${isCompleted ? '✓' : ''}
      </button>
      <div class="ro-group-header-left">
        <div class="ro-group-ro">#${esc(g.ro)}</div>
        <div class="ro-group-vehicle">${esc(g.vehicle)}</div>
      </div>
      <div style="text-align:right">
        <div class="ro-group-subtotal-label">SUBTOTAL</div>
        <div class="ro-group-subtotal">${subtotal.toFixed(2)}</div>
      </div>
    </div>
    ${serviceLines}
    <div class="ro-group-footer">
      <button class="add-svc-btn" onclick="toggleAddSvc('${roKey}')">
        ${isAddOpen ? '▲ CANCEL' : '+ ADD SERVICE'}
      </button>
      <button class="add-svc-btn" onclick="toggleMovePeriod('${roKey}')" style="color:var(--text3)">
        ${isMoveOpen ? '▲ CANCEL' : '⟵ MOVE PERIOD'}
      </button>
    </div>
    ${isAddOpen ? addSvcPanelHTML(g, selHtml) : ''}
    ${movePanelHTML}
  </div>`;
}

function addSvcPanelHTML(g, selHtml) {
  const roKey = g.ro.trim().toLowerCase();

  return `<div class="ro-add-svc-panel" id="addsvc-${roKey}">

      </div>

      </div>

      <label class="label">SERVICE</label>
      <select class="inp" id="as-service-${roKey}">${selHtml}</select>

function toggleEditPanel(id) {
  if (expandedEdits.has(id)) expandedEdits.delete(id);
  else { expandedEdits.add(id); }
  if (currentPage === 'log') renderLog();
  if (currentPage === 'history') renderHistory();
}

function toggleAddSvc(roKey) {
  if (expandedAddSvc.has(roKey)) expandedAddSvc.delete(roKey);
  else expandedAddSvc.add(roKey);
  if (currentPage === 'log') renderLog();
  if (currentPage === 'history') renderHistory();
}

function toggleCompleteRO(roKey) {
  if (completedROs[roKey]) delete completedROs[roKey];
  else completedROs[roKey] = true;
  save('completedROs', completedROs);
  if (currentPage === 'log') renderLog();
  if (currentPage === 'history') renderHistory();
}

function toggleShowCompleted() {
  showCompleted = !showCompleted;
  renderLog();
}

function toggleMovePeriod(roKey) {
  if (expandedMovePeriod.has(roKey)) expandedMovePeriod.delete(roKey);
  else { expandedMovePeriod.add(roKey); expandedAddSvc.delete(roKey); }
  if (currentPage === 'log') renderLog();
  if (currentPage === 'history') renderHistory();
}

function getAllPastAndCurrentPeriods() {
  // Returns all periods that have entries, plus the current period, sorted newest first
  const cp = getCurrentPeriod();
  const seen = new Set();
  const periods = [];
  // Always include current period
  const cpKey = periodKey(cp.start, cp.end);
  seen.add(cpKey);
  periods.push({ key: cpKey, start: cp.start, end: cp.end });
  entries.forEach(e => {
    const k = periodKey(e.periodStart, e.periodEnd);
    if (!seen.has(k)) { seen.add(k); periods.push({ key: k, start: e.periodStart, end: e.periodEnd }); }
  });
  return periods.sort((a, b) => b.key.localeCompare(a.key));
}

function moveROToPeriod(roKey) {
  const selectEl = document.getElementById(`move-period-${roKey}`);
  if (!selectEl || !selectEl.value) { showToast('Select a period', true); return; }
  const targetKey = selectEl.value;
  // Parse start/end from key (format: "start_end")
  const [targetStart, targetEnd] = targetKey.split('_');
  // Update all entries with this roKey
  let moved = 0;
  entries.forEach(e => {
    if (e.ro.trim().toLowerCase() === roKey) {
      e.periodStart = targetStart;
      e.periodEnd = targetEnd;
      moved++;
    }
  });
  if (moved === 0) { showToast('No entries found', true); return; }
  save('entries', entries);
  expandedMovePeriod.delete(roKey);
  showToast(`RO moved to ${periodLabel(targetStart, targetEnd)}`);
  if (currentPage === 'log') renderLog();
  if (currentPage === 'history') renderHistory();
}

function saveEdit(id) {
  const e = entries.find(x => x.id === id);
  if (!e) return;
  const ro = document.getElementById(`ep-ro-${id}`).value.trim();
  const date = document.getElementById(`ep-date-${id}`).value;
  const vehicle = document.getElementById(`ep-vehicle-${id}`).value.trim();
  const service = document.getElementById(`ep-service-${id}`).value;
  const hoursRaw = document.getElementById(`ep-hours-${id}`).value.trim();
  if (!ro) { showToast('RO# required', true); return; }
  if (!vehicle) { showToast('Vehicle required', true); return; }
  if (!hoursRaw || isNaN(parseFloat(hoursRaw)) || parseFloat(hoursRaw) <= 0) { showToast('Valid hours required', true); return; }
  const period = getPeriodForDate(date, anchorDate);
  e.ro = ro; e.date = date; e.vehicle = vehicle;
  e.service = service; e.hours = parseFloat(hoursRaw);
  e.periodStart = period.start; e.periodEnd = period.end;
  save('entries', entries);
  expandedEdits.delete(id);
  showToast('Entry updated');
  if (currentPage === 'log') renderLog();
  if (currentPage === 'history') renderHistory();
}

function addServiceToRO(roKey, ro, vehicle) {
  const date = document.getElementById(`as-date-${roKey}`).value;
  const service = document.getElementById(`as-service-${roKey}`).value;
  const hoursRaw = document.getElementById(`as-hours-${roKey}`).value.trim();
  if (!hoursRaw || isNaN(parseFloat(hoursRaw)) || parseFloat(hoursRaw) <= 0) { showToast('Valid hours required', true); return; }
  const period = getPeriodForDate(date, anchorDate);
  const entry = {
    id: Date.now().toString() + Math.random().toString(36).slice(2,6),
    ro, vehicle, date, service,
    hours: parseFloat(hoursRaw),
    periodStart: period.start,
    periodEnd: period.end
  };
  // Insert right after the last entry with same ro key
  const lastIdx = entries.reduce((best, e, i) => e.ro.trim().toLowerCase() === roKey ? i : best, -1);
  if (lastIdx >= 0) entries.splice(lastIdx + 1, 0, entry);
  else entries.unshift(entry);
  save('entries', entries);
  expandedAddSvc.delete(roKey);
  showToast('Service line added');
  if (currentPage === 'log') renderLog();
  if (currentPage === 'history') renderHistory();
}

function getCurrentPeriodEntries() {
  const p = getCurrentPeriod();
  return entries.filter(e => e.periodStart === p.start && e.periodEnd === p.end);
}

function addEntry() {
  const ro = document.getElementById('f-ro').value.trim();
  const vehicle = document.getElementById('f-vehicle').value.trim();
  const date = document.getElementById('f-date').value;
  const service = document.getElementById('f-service').value;
  const hoursRaw = document.getElementById('f-hours').value.trim();
  const errEl = document.getElementById('form-err');

  if (!ro) { showErr('RO# is required'); return; }
  if (!vehicle) { showErr('Vehicle info is required'); return; }
  if (!hoursRaw || isNaN(parseFloat(hoursRaw)) || parseFloat(hoursRaw) <= 0) { showErr('Enter valid hours (e.g. 2.5)'); return; }

  errEl.style.display = 'none';

  const period = getPeriodForDate(date, anchorDate);
  const entry = {
    id: Date.now().toString() + Math.random().toString(36).slice(2,6),
    ro, vehicle, date, service,
    hours: parseFloat(hoursRaw),
    periodStart: period.start,
    periodEnd: period.end
  };

  entries.unshift(entry);
  save('entries', entries);
  showToast('Entry logged');
  renderLog();
}

function showErr(msg) {
  const el = document.getElementById('form-err');
  el.textContent = msg;
  el.style.display = 'block';
}

async function deleteEntry(id) {
  const ok = await showModal('Delete this entry? This cannot be undone.');
  if (!ok) return;
  entries = entries.filter(e => e.id !== id);
  expandedEdits.delete(id);
  save('entries', entries);
  showToast('Entry deleted');
  if (currentPage === 'log') renderLog();
  if (currentPage === 'history') renderHistory();
}

// ═══════════════════════════════════════════════════════════
// HISTORY PAGE
// ═══════════════════════════════════════════════════════════
function renderHistory() {
  const cp = getCurrentPeriod();
  const cpKey = periodKey(cp.start, cp.end);

  // Group entries by period, exclude current
  const groups = {};
  entries.forEach(e => {
    const k = periodKey(e.periodStart, e.periodEnd);
    if (k === cpKey) return;
    if (!groups[k]) groups[k] = { entries: [], start: e.periodStart, end: e.periodEnd };
    groups[k].entries.push(e);
  });

  const sorted = Object.entries(groups).sort((a, b) => b[0].localeCompare(a[0]));

  let html = `<div class="label" style="padding-bottom:0.25rem">PAST PAY PERIODS</div>`;

  if (sorted.length === 0) {
    html += `<div class="empty">NO PAST PERIODS YET</div>`;
  } else {
    // All-time export
    html += `<div class="export-row fade-in">
      <button class="btn btn-ghost" onclick="exportAllCSV('flag-hours-all.csv')">↓ EXPORT ALL ROs (CSV)</button>
    </div>`;

    sorted.forEach(([k, group]) => {
      const total = group.entries.reduce((s, e) => s + e.hours, 0);
      const label = periodLabel(group.start, group.end);
      const isOpen = expandedPeriods.has(k);

      html += `<div class="hist-period fade-in">
        <div class="hist-header" onclick="togglePeriod('${k}')">
          <div>
            <div class="hist-period-label">${label}</div>
            <div class="hist-meta">${group.entries.length} entr${group.entries.length === 1 ? 'y' : 'ies'}</div>
          </div>
          <div style="display:flex;align-items:center;gap:1rem">
            <div style="text-align:right">
              <div class="label">TOTAL</div>
              <div class="hist-total">${total.toFixed(2)} HRS</div>
            </div>
            <span class="hist-chevron ${isOpen ? 'open' : ''}">▼</span>
          </div>
        </div>`;

      if (isOpen) {
        const selHtml = services.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
        html += `<div class="hist-body">
          <div style="margin-bottom:0.5rem">
            <button class="btn btn-ghost" onclick="exportCSV(getGroupEntries('${k}'), 'flag-hours-${group.start}.csv')">↓ EXPORT THIS PERIOD</button>
          </div>
          ${renderGroupedEntries(group.entries, selHtml)}
        </div>`;
      }

      html += `</div>`;
    });
  }

  document.getElementById('page-history').innerHTML = html;
}

function togglePeriod(k) {
  if (expandedPeriods.has(k)) expandedPeriods.delete(k);
  else expandedPeriods.add(k);
  renderHistory();
}

function getGroupEntries(k) {
  return entries.filter(e => periodKey(e.periodStart, e.periodEnd) === k);
}

      <div style="display:flex;gap:0.5rem;margin-top:0.25rem;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="exportAllCSV('flag-hours-all-${currentUser.id}.csv')" style="flex:1;justify-content:center;min-width:140px">↓ EXPORT ROs (CSV)</button>
        <button class="btn btn-accent" onclick="exportBackup()" style="flex:1;justify-content:center;min-width:140px">↓ EXPORT BACKUP (JSON)</button>
      </div>

      <div style="display:flex;gap:0.5rem;margin-top:0.5rem;flex-wrap:wrap">
        <label class="btn btn-ghost" style="flex:1;justify-content:center;min-width:140px; cursor:pointer;">
          ↑ IMPORT BACKUP (JSON)
          <input type="file" id="import-file" accept=".json" style="display:none" onchange="importBackup(event)" />
        </label>
        <button class="btn btn-danger" onclick="clearAllData()" style="flex:1;justify-content:center;min-width:140px">⚠ CLEAR ALL DATA</button>
      </div>
    </div>

    <div class="settings-section fade-in">
      <div class="settings-section-title">GOOGLE DRIVE BACKUP</div>
      <div class="label" style="line-height:1.8;margin-bottom:0.5rem;">
        Uploads a full backup JSON to your Google Drive. Write-only — this app never reads from your Drive.
        Each backup is saved as a new file named with today's date.
      </div>
      <div class="gdrive-status">
        <div class="gdrive-dot ${gdriveToken ? 'connected' : ''}" id="gdrive-dot"></div>
        <span id="gdrive-status-text">${gdriveToken ? 'Connected to Google Drive' : 'Not connected'}</span>
      </div>
      ${!GDRIVE_CLIENT_ID ? `<div class="label" style="color:var(--danger);line-height:1.8;margin-bottom:0.5rem;">
        ⚠ OAuth Client ID not set. Open the HTML file and paste your Google Cloud OAuth 2.0 Client ID into the <code style="color:var(--accent)">GDRIVE_CLIENT_ID</code> constant near the top of the script.
      </div>` : ''}
      <button id="gdrive-backup-btn" class="btn btn-accent" onclick="backupToDrive()" style="width:100%;justify-content:center" ${!GDRIVE_CLIENT_ID ? 'disabled' : ''}>
        ☁ BACKUP TO DRIVE
      </button>
      ${gdriveToken ? '' : `<button class="btn btn-ghost" onclick="requestDriveAccess()" style="width:100%;justify-content:center;margin-top:0.4rem">
        CONNECT GOOGLE ACCOUNT
      </button>`}
    </div>
  `;
}

function saveAnchor() {
  const val = document.getElementById('s-anchor').value;
  if (!val) { showToast('Select a date', true); return; }
  anchorDate = val;
  save('anchor', anchorDate);
  showToast('Anchor date saved');
}

function saveServices() {
  const inputs = document.querySelectorAll('.svc-input');
  const list = [];
  inputs.forEach(inp => { const v = inp.value.trim(); if (v) list.push(v); });
  if (list.length === 0) { showToast('Add at least one service', true); return; }
  services = list;
  save('services', services);
  showToast('Services saved');
  renderSettings();
}

function addService() {
  // Read current values before re-render
  readServiceInputs();
  services.push('');
  renderSettings();
  // Focus the new input
  const inputs = document.querySelectorAll('.svc-input');
  if (inputs.length) inputs[inputs.length - 1].focus();
}

function removeService(i) {
  readServiceInputs();
  if (services.length <= 1) { showToast('Need at least one service', true); return; }
  services.splice(i, 1);
  renderSettings();
}

function moveService(i, dir) {
  readServiceInputs();
  const j = i + dir;
  if (j < 0 || j >= services.length) return;
  [services[i], services[j]] = [services[j], services[i]];
  renderSettings();
}

function readServiceInputs() {
  const inputs = document.querySelectorAll('.svc-input');
  const list = [];
  inputs.forEach(inp => { const v = inp.value.trim(); if (v) list.push(v); });
  if (list.length > 0) services = list;
}

function setTheme(theme) {
  applyTheme(theme);
  save('theme', theme);
  showToast(`${THEME_LABELS[theme]} theme applied`);
  renderSettings();
}

async function clearAllData() {
  const ok1 = await showModal('This will permanently delete ALL your entries and settings. Are you sure?', 'CLEAR ALL DATA');
  if (!ok1) return;
  const ok2 = await showModal('Last chance — this cannot be undone. Delete everything?', '⚠ FINAL WARNING');
  if (!ok2) return;
  ['entries','services','theme','anchor','verifyChecks','verifyMissing','verifySelectedPeriod','completedROs'].forEach(k => localStorage.removeItem(nsKey(k)));
  entries = []; services = [...DEFAULT_SERVICES]; currentTheme = 'terminal'; anchorDate = DEFAULT_ANCHOR;
  verifyChecks = {}; verifyMissing = []; verifySelectedPeriod = null; completedROs = {};
  applyTheme('terminal');
  showToast('All data cleared');
  renderSettings();
  switchPage('log');
}

// ═══════════════════════════════════════════════════════════
// VERIFY PAGE
// ═══════════════════════════════════════════════════════════
function saveVerify() {
  save('verifyChecks', verifyChecks);
  save('verifyMissing', verifyMissing);
  save('verifySelectedPeriod', verifySelectedPeriod);
}

function renderVerify() {
  const periods = getAllPastAndCurrentPeriods();
  const el = document.getElementById('page-verify');

  if (periods.length === 0) {
    el.innerHTML = `<div class="empty fade-in">NO ENTRIES LOGGED YET</div>`;
    return;
  }

  if (!verifySelectedPeriod || !periods.find(p => p.key === verifySelectedPeriod)) {
    verifySelectedPeriod = periods[0].key;
    saveVerify();
  }

  // Only entries in the selected period that belong to COMPLETED ROs
  const allPeriodEntries = entries.filter(e => periodKey(e.periodStart, e.periodEnd) === verifySelectedPeriod);
  const periodEntries = allPeriodEntries.filter(e => !!completedROs[e.ro.trim().toLowerCase()]);
  const incompletePeriodCount = allPeriodEntries.filter(e => !completedROs[e.ro.trim().toLowerCase()]).length;

  const periodOptions = periods.map(p =>
    `<option value="${p.key}" ${p.key === verifySelectedPeriod ? 'selected' : ''}>${periodLabel(p.start, p.end)}</option>`
  ).join('');

  // Group by RO for display
  const groups = groupByRO(periodEntries);
  const totalROs = groups.length;
  const confirmedROs = groups.filter(g => {
    return g.lines.every(e => verifyChecks[e.id] === 'confirmed');
  }).length;
  const confirmedHrs = periodEntries.filter(e => verifyChecks[e.id] === 'confirmed').reduce((s, e) => s + e.hours, 0);
  const missingHrs = periodEntries.filter(e => verifyChecks[e.id] === 'missing').reduce((s, e) => s + e.hours, 0);
  const totalHrs = periodEntries.reduce((s, e) => s + e.hours, 0);
  const pct = totalROs > 0 ? Math.round((confirmedROs / totalROs) * 100) : 0;

  const entryRows = groups.map(g => {
    const roKey = g.ro.trim().toLowerCase();
    const subtotal = g.lines.reduce((s, e) => s + e.hours, 0);
    const allConfirmed = g.lines.every(e => verifyChecks[e.id] === 'confirmed');
    const anyMissing = g.lines.some(e => verifyChecks[e.id] === 'missing');
    const rowClass = allConfirmed ? 'confirmed' : anyMissing ? 'missing' : '';

    const lines = g.lines.map(e => {
      const state = verifyChecks[e.id] || '';
      const isConfirmed = state === 'confirmed';
      const isMissing = state === 'missing';
      return `<div class="verify-ro-row ${isConfirmed ? 'confirmed' : isMissing ? 'missing' : ''}" style="padding-left:1.5rem;border-top:1px solid var(--border)">
        <div class="verify-check ${isConfirmed ? 'checked' : ''}" onclick="toggleVerify('${e.id}','confirmed')" title="On timesheet">${isConfirmed ? '✓' : ''}</div>
        <div class="verify-ro-info">
          <div class="verify-service">${esc(e.service)}<span style="color:var(--text3);font-size:0.6rem;margin-left:0.4rem">${e.date}</span></div>
        </div>
        <div class="verify-hrs ${isConfirmed ? 'confirmed' : isMissing ? 'missing' : ''}">${Number(e.hours).toFixed(2)}</div>
        <div class="verify-check ${isMissing ? 'marked-missing' : ''}" onclick="toggleVerify('${e.id}','missing')" title="Missing from timesheet" style="border-color:var(--danger);color:var(--danger)">${isMissing ? '✕' : ''}</div>
      </div>`;
    }).join('');

    return `<div style="display:flex;flex-direction:column;border:1px solid var(--border)">
      <div class="verify-ro-row ${rowClass}" style="border:none;background:var(--bg2)">
        <div class="verify-check" style="cursor:default;opacity:0;pointer-events:none"></div>
        <div class="verify-ro-info">
          <div class="verify-ro-num ${anyMissing ? 'missing-text' : ''}">#${esc(g.ro)}${anyMissing ? '<span style="color:var(--danger);font-size:0.58rem;margin-left:0.4rem">NOT ON TIMESHEET</span>' : ''}</div>
          <div class="verify-vehicle">${esc(g.vehicle)}</div>
        </div>
        <div class="verify-hrs" style="font-size:1.1rem;color:var(--accent)">${subtotal.toFixed(2)}</div>
        <div class="verify-check" style="cursor:default;opacity:0;pointer-events:none"></div>
      </div>
      ${lines}
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="period-header fade-in">
      <div style="flex:1">
        <div class="label">TIMESHEET VERIFY</div>
        <div class="period-dates" style="font-size:0.75rem;margin-top:0.2rem">Only completed ROs appear here. Mark each line confirmed ✓ or missing ✕.</div>
      </div>
    </div>

    <div class="card card-pad fade-in" style="display:flex;flex-direction:column;gap:0.6rem">
      <div class="label">SELECT PAY PERIOD</div>
      <select class="inp" onchange="setVerifyPeriod(this.value)">${periodOptions}</select>
      ${incompletePeriodCount > 0 ? `<div class="label" style="color:var(--danger)">⚠ ${incompletePeriodCount} incomplete RO line${incompletePeriodCount !== 1 ? 's' : ''} in this period are hidden — mark them complete on the LOG tab to see them here, or move them to a different period.</div>` : ''}
    </div>

    <div class="verify-status-bar fade-in">
      <div>
        <div class="label">VERIFIED ROs</div>
        <div style="font-size:1rem;font-weight:700;color:var(--text);font-family:var(--font-display);letter-spacing:0.05em">${confirmedROs} / ${totalROs}</div>
      </div>
      <div style="text-align:center">
        <div class="label">CONFIRMED HRS</div>
        <div style="font-size:1rem;font-weight:700;color:var(--success);font-family:var(--font-display)">${confirmedHrs.toFixed(2)}</div>
      </div>
      <div style="text-align:right">
        <div class="label">MISSING HRS</div>
        <div style="font-size:1rem;font-weight:700;color:var(--danger);font-family:var(--font-display)">${missingHrs.toFixed(2)}</div>
      </div>
    </div>
    <div class="verify-progress" style="margin-top:-0.85rem">
      <div class="verify-progress-fill" style="width:${pct}%"></div>
    </div>

    <div style="display:flex;gap:0.5rem;flex-wrap:wrap" class="fade-in">
      <button class="btn btn-ghost" onclick="checkAllVerify()" style="flex:1;justify-content:center;min-width:120px">✓ CHECK ALL</button>
      <button class="btn btn-ghost" onclick="uncheckAllVerify()" style="flex:1;justify-content:center;min-width:120px">✕ CLEAR ALL</button>
    </div>

    <div class="fade-in">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:0.4rem 0.85rem 0.25rem">
        <div class="verify-section-label" style="padding:0">COMPLETED ROs THIS PERIOD</div>
        <div style="display:flex;gap:1.2rem;font-size:0.58rem;letter-spacing:0.12em;color:var(--text3)">
          <span style="color:var(--success)">✓ ON SHEET</span>
          <span style="color:var(--danger)">✕ MISSING</span>
        </div>
      </div>
      ${groups.length === 0
        ? `<div class="empty" style="padding:1.5rem">NO COMPLETED ROs FOR THIS PERIOD</div>`
        : entryRows}
    </div>
  `;
}

function setVerifyPeriod(key) {
  verifySelectedPeriod = key;
  saveVerify();
  renderVerify();
}

function toggleVerify(id, action) {
  // If already in that state, toggle it off. Otherwise set it.
  if (verifyChecks[id] === action) delete verifyChecks[id];
  else verifyChecks[id] = action;
  saveVerify();
  renderVerify();
}

function checkAllVerify() {
  const periodEntries = entries.filter(e =>
    periodKey(e.periodStart, e.periodEnd) === verifySelectedPeriod &&
    !!completedROs[e.ro.trim().toLowerCase()]
  );
  periodEntries.forEach(e => { verifyChecks[e.id] = 'confirmed'; });
  saveVerify();
  renderVerify();
}

function uncheckAllVerify() {
  const periodEntries = entries.filter(e =>
    periodKey(e.periodStart, e.periodEnd) === verifySelectedPeriod &&
    !!completedROs[e.ro.trim().toLowerCase()]
  );
  periodEntries.forEach(e => { delete verifyChecks[e.id]; });
  saveVerify();
  renderVerify();
}

// ═══════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════
function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Expose globally for inline onclick
window.localLogin = localLogin;
window.signOut = signOut;
window.switchPage = switchPage;
window.addEntry = addEntry;
window.deleteEntry = deleteEntry;
window.togglePeriod = togglePeriod;
window.getGroupEntries = getGroupEntries;
window.exportCSV = exportCSV;
window.exportBackup = exportBackup;
window.backupToDrive = backupToDrive;
window.requestDriveAccess = requestDriveAccess;
window.importBackup = importBackup;
window.getCurrentPeriodEntries = getCurrentPeriodEntries;
window.saveAnchor = saveAnchor;
window.saveServices = saveServices;
window.addService = addService;
window.removeService = removeService;
window.moveService = moveService;
window.setTheme = setTheme;
window.clearAllData = clearAllData;
window.exportAllCSV = function(filename) { exportCSV(entries, filename); };
window.setVerifyPeriod = setVerifyPeriod;
window.toggleVerify = toggleVerify;
window.checkAllVerify = checkAllVerify;
window.uncheckAllVerify = uncheckAllVerify;
window.toggleEditPanel = toggleEditPanel;
window.toggleAddSvc = toggleAddSvc;
window.saveEdit = saveEdit;
window.addServiceToRO = addServiceToRO;
window.toggleCompleteRO = toggleCompleteRO;
window.toggleShowCompleted = toggleShowCompleted;
window.toggleMovePeriod = toggleMovePeriod;
window.moveROToPeriod = moveROToPeriod;
</script>
